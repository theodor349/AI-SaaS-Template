name: E2E
# The nightly app health check finds nightly runs by this name. An empty
# run-name falls back to GitHub's default: the pull request title, or the
# workflow name for other manual runs.
run-name: ${{ inputs.suite == 'nightly' && 'Nightly E2E' || '' }}

# Runs the integration and browser suites against a real local stack: bootstrap's
# local Convex backend, the shared Clerk development instance, and the shared
# Polar sandbox organization. Provider rate limits are shared with local agents,
# so pull requests only run when they carry the `run-e2e` or `run-e2e-full`
# label. With `run-e2e`, every run, from adding the label to each later push,
# runs the tests tagged @critical plus the specs that tests/e2e/spec-map.json
# maps to the files the pull request changes against main. A change to a shared
# file, or to runtime code the map doesn't cover, runs the full suite.
# `run-e2e-full` runs the full suite on every run instead. A push cancels the
# run still in progress and starts one for the new commit.
#
# Main runs the critical tests nightly rather than on every merge to save CI
# minutes, and the full suite on Sundays (UTC) so tests that rarely run don't go
# stale. GitHub starts `schedule` runs hours late, so the `nightly-e2e.timer`
# systemd user unit on ulm starts the nightly at 00:00 UTC instead, with
# `gh workflow run E2E --ref main -f suite=nightly`. Manual runs use the full
# suite unless they pick critical.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: The full suite, only the tests tagged @critical, or nightly, which picks by weekday
        type: choice
        options: [full, critical, nightly]
        default: full
  pull_request:
    # Not `opened`. GitHub's APIs create a pull request without labels and add
    # them in a second call, so opening one with a label also sends `labeled`.
    # Running on both started two runs, and the concurrency group cancelled one,
    # which GitHub could then show as the head's E2E check.
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  preflight:
    name: Check E2E credentials
    # Ignore unrelated label events so they cannot start or cancel a run.
    if: >-
      github.event_name != 'pull_request' ||
      ((contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e-full')) &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'run-e2e' || github.event.label.name == 'run-e2e-full'))
    # GitHub-hosted unless the repository variable E2E_RUNNER names a self-hosted
    # runner as a JSON array of labels, such as ["self-hosted","ulm"]. Only a
    # private repository should set it. See docs/deployment.md.
    runs-on: ${{ fromJSON(vars.E2E_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 2
    # The suite's group, so a newer event cancels this pull request's running
    # suite as soon as it is queued. Without it, on a self-hosted runner this job
    # waits for the runner that the outdated suite holds, and the outdated suite
    # runs to the end.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      checks: read
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
      suite: ${{ steps.check.outputs.suite }}
    steps:
      - name: Check required secrets
        id: check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_PRODUCT_MONTHLY: ${{ secrets.POLAR_PRODUCT_MONTHLY }}
          POLAR_PRODUCT_YEARLY: ${{ secrets.POLAR_PRODUCT_YEARLY }}
          POLAR_PRODUCT_LIFETIME: ${{ secrets.POLAR_PRODUCT_LIFETIME }}
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_SUITE: ${{ inputs.suite }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e-full') }}
        # Integration asserts the three synced Polar products and signed Polar
        # webhooks, and billing E2E calls the sandbox API, so Polar is required
        # unless app.config.ts sets `billing: false`, which skips those tests.
        run: |
          suite=full
          nightly=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$DISPATCHED_SUITE" = nightly ] && nightly=true
            # The nightly runs the full suite on Sundays (UTC) and the critical tests otherwise.
            if [ "$DISPATCHED_SUITE" = critical ] || { [ "$nightly" = true ] && [ "$(date -u +%u)" != 7 ]; }; then
              suite=critical
            fi
          fi
          # The e2e job picks a pull request's specs from its changed files.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$FULL_LABEL" != true ]; then suite=affected; fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          required=(NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY)
          # Read the billing switch through the API rather than a checkout. A
          # self-hosted runner keeps its workspace between jobs, and a sparse
          # checkout here left it sparse for the next CI job, which then found
          # only this file.
          config=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/app.config.ts?ref=$GITHUB_SHA")
          if ! grep -Eq '^\s*billing:\s*false\s*,?\s*$' <<< "$config"; then
            required+=(POLAR_ACCESS_TOKEN POLAR_PRODUCT_MONTHLY POLAR_PRODUCT_YEARLY POLAR_PRODUCT_LIFETIME)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            # The nightly critical run skips a commit that an earlier run of
            # either suite already passed. The Sunday full run always runs.
            if [ "$nightly" = true ] && [ "$suite" = critical ]; then
              passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Integration%20and%20E2E" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length')
              if [ "$passed" -gt 0 ]; then
                echo "::notice title=E2E skipped::$GITHUB_SHA already passed E2E."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="E2E skipped: missing secrets ${missing[*]}. Fork and Dependabot pull requests do not receive repository secrets."
          echo "::notice title=E2E skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "available=false" >> "$GITHUB_OUTPUT"

  e2e:
    name: Integration and E2E
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    # The same runner as preflight.
    runs-on: ${{ fromJSON(vars.E2E_RUNNER || '"ubuntu-latest"') }}
    # Sized for a GitHub-hosted runner, which has 2 cores for a private
    # repository and 4 for a public one. ulm has 8.
    timeout-minutes: 60
    # Job-level so skipped label events never cancel a running suite. A push to a
    # labeled pull request cancels its running suite and tests the new commit.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # WORKTREE_ID derives from the checkout path. A per-run path keeps concurrent
      # runs from sharing Clerk test-user labels, sweeps, and Polar customer IDs.
      APP_DIR: run-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ env.APP_DIR }}
          persist-credentials: false
          # A pull request checks out GitHub's merge commit, whose first parent is
          # main, so the spec selection can diff against it.
          fetch-depth: 2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: ${{ env.APP_DIR }}/package.json
          # Jobs from every runner on ulm share the default ~/setup-pnpm and collide there.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ${{ env.APP_DIR }}/.node-version
          # A GitHub-hosted runner starts without a pnpm store, so restore it from
          # the Actions cache. An empty value turns the cache off.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          cache-dependency-path: ${{ env.APP_DIR }}/pnpm-lock.yaml
      # Before bootstrap writes files into the checkout, so the diff holds only
      # the pull request's changes.
      - name: Select E2E tests
        id: select
        if: needs.preflight.outputs.suite == 'affected'
        run: node scripts/e2e-affected.mjs --base HEAD^1 --github-output
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A self-hosted runner keeps the pnpm store, Playwright browsers and the
      # Convex local backend in its home directory between runs, so nothing needs
      # caching there. Chromium's system libraries take sudo to install, which its
      # jobs don't have, so ulm has them installed once. A GitHub-hosted runner
      # starts empty and has sudo, so --with-deps installs the libraries. It
      # downloads Chromium and the Convex local backend on every run. Caching
      # either one would need its own step and cache key.
      - name: Install Chromium
        run: pnpm exec playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Write bootstrap credentials
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_ORGANIZATION_ID: ${{ secrets.POLAR_ORGANIZATION_ID }}
          POLAR_PRODUCT_MONTHLY: ${{ secrets.POLAR_PRODUCT_MONTHLY }}
          POLAR_PRODUCT_YEARLY: ${{ secrets.POLAR_PRODUCT_YEARLY }}
          POLAR_PRODUCT_LIFETIME: ${{ secrets.POLAR_PRODUCT_LIFETIME }}
        run: |
          umask 077
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY POLAR_ACCESS_TOKEN POLAR_ORGANIZATION_ID \
            POLAR_PRODUCT_MONTHLY POLAR_PRODUCT_YEARLY POLAR_PRODUCT_LIFETIME; do
            printf '%s=%s\n' "$name" "${!name}"
          done > .env.bootstrap.local
          chmod 600 .env.bootstrap.local

      - name: Start bootstrap
        id: bootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          nohup pnpm bootstrap --local > "$RUNNER_TEMP/e2e-logs/bootstrap-console.log" 2>&1 &
      - name: Wait for bootstrap
        id: ready
        run: pnpm bootstrap:wait --timeout 600

      - name: Integration tests
        id: integration
        run: pnpm test:integration
      # Run the browser suite even when integration fails so both report.
      - name: E2E tests (${{ needs.preflight.outputs.suite }})
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          SUITE: ${{ needs.preflight.outputs.suite }}
          # Empty for the full suite.
          GREP: ${{ steps.select.outputs.grep }}
        run: |
          if [ "$SUITE" = critical ]; then pnpm test:e2e:critical
          elif [ -n "$GREP" ]; then pnpm test:e2e --grep "$GREP"
          else pnpm test:e2e; fi

      - name: Stop bootstrap
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        run: pnpm bootstrap:stop
      - name: Remove Clerk test users
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        run: pnpm clerk:sweep --older-than 0s

      # Print logs into the job output, where GitHub masks secret values; uploaded
      # artifacts are not masked. Playwright traces and screenshots stay off
      # because they would capture Clerk session tokens.
      - name: Show bootstrap logs
        if: ${{ failure() && steps.bootstrap.outcome == 'success' }}
        run: |
          echo "::group::bootstrap console"
          cat "$RUNNER_TEMP/e2e-logs/bootstrap-console.log" || true
          echo "::endgroup::"
          echo "::group::bootstrap service log"
          cat "$(git rev-parse --path-format=absolute --git-path bootstrap.log)" || true
          echo "::endgroup::"

      # A self-hosted runner keeps its workspace, so remove this run's checkout,
      # which holds the credentials file and the local Convex database.
      - name: Remove run checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf "$APP_DIR"
