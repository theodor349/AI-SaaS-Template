name: E2E

# Runs the integration and browser suites against a real local stack: bootstrap's
# local Convex backend, the shared Clerk development instance, and the shared
# Polar sandbox organization. Provider rate limits are shared with local agents,
# so pull requests only run when they carry the `run-e2e` label. Adding the label
# runs the full suite, and later pushes to the labeled pull request run only the
# tests tagged @critical. A push cancels a full run still in progress, so to get a
# full run on the latest commit, remove the label and add it back. Reopening a
# labeled pull request also runs the critical tests. Main runs the critical tests
# nightly rather than on every merge to save CI minutes, and the full suite weekly
# so tests that rarely run don't go stale. Manual runs use the full suite unless
# they pick critical.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: The full suite, or only the tests tagged @critical
        type: choice
        options: [full, critical]
        default: full
  schedule:
    # Keep the weekly cron in sync with the preflight step that picks the suite.
    - cron: "17 2 * * 1-6"
    - cron: "17 2 * * 0"
  pull_request:
    # Not `opened`. GitHub's APIs create a pull request without labels and add
    # them in a second call, so opening one with `run-e2e` also sends `labeled`.
    # Running on both started two runs, and the concurrency group cancelled one,
    # which GitHub could then show as the head's E2E check.
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  preflight:
    name: Check E2E credentials
    # Ignore unrelated label events so they cannot start or cancel a run.
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run-e2e'))
    runs-on: [self-hosted, ulm]
    timeout-minutes: 2
    permissions:
      checks: read
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
      suite: ${{ steps.check.outputs.suite }}
    steps:
      # Only for the billing switch, which decides whether Polar secrets are required.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: app.config.ts
          sparse-checkout-cone-mode: false
      - name: Check required secrets
        id: check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_PRODUCT_MONTHLY: ${{ secrets.POLAR_PRODUCT_MONTHLY }}
          POLAR_PRODUCT_YEARLY: ${{ secrets.POLAR_PRODUCT_YEARLY }}
          POLAR_PRODUCT_LIFETIME: ${{ secrets.POLAR_PRODUCT_LIFETIME }}
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCHED_SUITE: ${{ inputs.suite }}
          PR_ACTION: ${{ github.event.action }}
        # Integration asserts the three synced Polar products and signed Polar
        # webhooks, and billing E2E calls the sandbox API, so Polar is required
        # unless app.config.ts sets `billing: false`, which skips those tests.
        run: |
          suite=full
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$SCHEDULE" != "17 2 * * 0" ]; then suite=critical; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DISPATCHED_SUITE" = critical ]; then suite=critical; fi
          # Adding the label runs the full suite, including at pull request creation.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$PR_ACTION" != labeled ]; then suite=critical; fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          required=(NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY)
          if ! grep -Eq '^\s*billing:\s*false\s*,?\s*$' app.config.ts; then
            required+=(POLAR_ACCESS_TOKEN POLAR_PRODUCT_MONTHLY POLAR_PRODUCT_YEARLY POLAR_PRODUCT_LIFETIME)
          fi
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            # The nightly critical run skips a main commit that an earlier run of
            # either suite already passed. The weekly full run always runs.
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$suite" = critical ]; then
              passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Integration%20and%20E2E" \
                --jq '[.check_runs[] | select(.conclusion == "success")] | length')
              if [ "$passed" -gt 0 ]; then
                echo "::notice title=E2E skipped::$GITHUB_SHA already passed E2E."
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="E2E skipped: missing secrets ${missing[*]}. Fork and Dependabot pull requests do not receive repository secrets."
          echo "::notice title=E2E skipped::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "available=false" >> "$GITHUB_OUTPUT"

  e2e:
    name: Integration and E2E
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: [self-hosted, ulm]
    timeout-minutes: 45
    # Job-level so skipped label events never cancel a running suite. A push to a
    # labeled pull request cancels its running full suite and runs the critical
    # tests on the new commit instead.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # WORKTREE_ID derives from the checkout path. A per-run path keeps concurrent
      # runs from sharing Clerk test-user labels, sweeps, and Polar customer IDs.
      APP_DIR: run-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: ${{ env.APP_DIR }}
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: ${{ env.APP_DIR }}/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ${{ env.APP_DIR }}/.node-version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The runner keeps the pnpm store, Playwright browsers and the Convex local
      # backend in its home directory between runs, so nothing needs caching.
      # Chromium's system libraries take sudo to install, so ulm has them
      # installed once instead of through --with-deps.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Write bootstrap credentials
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_ORGANIZATION_ID: ${{ secrets.POLAR_ORGANIZATION_ID }}
          POLAR_PRODUCT_MONTHLY: ${{ secrets.POLAR_PRODUCT_MONTHLY }}
          POLAR_PRODUCT_YEARLY: ${{ secrets.POLAR_PRODUCT_YEARLY }}
          POLAR_PRODUCT_LIFETIME: ${{ secrets.POLAR_PRODUCT_LIFETIME }}
        run: |
          umask 077
          for name in NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY POLAR_ACCESS_TOKEN POLAR_ORGANIZATION_ID \
            POLAR_PRODUCT_MONTHLY POLAR_PRODUCT_YEARLY POLAR_PRODUCT_LIFETIME; do
            printf '%s=%s\n' "$name" "${!name}"
          done > .env.bootstrap.local
          chmod 600 .env.bootstrap.local

      - name: Start bootstrap
        id: bootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          nohup pnpm bootstrap --local > "$RUNNER_TEMP/e2e-logs/bootstrap-console.log" 2>&1 &
      - name: Wait for bootstrap
        id: ready
        run: pnpm bootstrap:wait --timeout 600

      - name: Integration tests
        id: integration
        run: pnpm test:integration
      # Run the browser suite even when integration fails so both report.
      - name: E2E tests (${{ needs.preflight.outputs.suite }})
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          SUITE: ${{ needs.preflight.outputs.suite }}
        run: |
          if [ "$SUITE" = critical ]; then pnpm test:e2e:critical; else pnpm test:e2e; fi

      - name: Stop bootstrap
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        run: pnpm bootstrap:stop
      - name: Remove Clerk test users
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        run: pnpm clerk:sweep --older-than 0s

      # Print logs into the job output, where GitHub masks secret values; uploaded
      # artifacts are not masked. Playwright traces and screenshots stay off
      # because they would capture Clerk session tokens.
      - name: Show bootstrap logs
        if: ${{ failure() && steps.bootstrap.outcome == 'success' }}
        run: |
          echo "::group::bootstrap console"
          cat "$RUNNER_TEMP/e2e-logs/bootstrap-console.log" || true
          echo "::endgroup::"
          echo "::group::bootstrap service log"
          cat "$(git rev-parse --path-format=absolute --git-path bootstrap.log)" || true
          echo "::endgroup::"

      # The runner keeps its workspace, so remove this run's checkout, which holds
      # the credentials file and the local Convex database.
      - name: Remove run checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf "$APP_DIR"
